changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: CI, Packaging, and Tooling
      labels:
        - ci
        - packaging
        - tooling
    - title: Tests and Quality
      labels:
        - tests
        - quality
        - security
    - title: Other Changes
      labels:
        - "*"
