name: Thread sanitizer

on:
  pull_request:
    paths:
      - ".github/workflows/thread-sanitizer.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "include/**"
      - "source/**"
      - "tests/headless_render_test.cpp"
      - "tests/lifetime_stress_test.cpp"
      - "scripts/verify-thread-sanitizer.sh"
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-tsan:
    name: Headless TSan smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Clang 22 and dependencies
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt-llvm.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22 libclang-rt-22-dev g++-14 ninja-build libfreetype-dev libtinyxml2-dev
      - name: Run focused TSan smoke
        env:
          BUILD_DIR: build-tsan
          CXX: clang++-22
          TSAN_OPTIONS: halt_on_error=1
        run: scripts/verify-thread-sanitizer.sh
