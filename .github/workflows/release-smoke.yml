name: Release smoke

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - ".github/workflows/release-smoke.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "source/**"
      - "tests/package_consumer/**"
      - "tests/consumer/**"
      - "tests/installed_headers/**"
      - "tests/backend_package_consumer/**"
      - "tests/package_components/**"
      - "scripts/verify-cpack.sh"
      - "scripts/verify-backend-packages.sh"
      - "scripts/verify-external-consumers.sh"
      - "scripts/verify-installed-headers.sh"
      - "scripts/verify-path-with-spaces.sh"
      - "scripts/verify-pkg-config.sh"
      - "scripts/verify-release-archive.sh"
      - "scripts/verify-release-asset.sh"
      - "scripts/verify-shared-library.sh"
      - "scripts/verify-msvc-exports.ps1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    name: Source archive install smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev
      - name: Verify release archive
        env:
          CXX: g++-14
          TEXRENDER_ARCHIVE_VERSION: ${{ github.ref_name }}
        run: scripts/verify-release-archive.sh
      - name: Upload archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-archive-${{ github.run_id }}
          path: /tmp/texrender-release-archive/artifacts

  cpack:
    name: CPack archive smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev
      - name: Verify CPack archives
        env:
          CC: gcc-14
          CXX: g++-14
        run: scripts/verify-cpack.sh
      - name: Upload CPack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpack-smoke-${{ github.run_id }}
          path: /tmp/texrender-cpack/artifacts

  external-consumers:
    name: External consumer smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev
      - name: Verify external consumers
        env:
          CC: gcc-14
          CXX: g++-14
        run: scripts/verify-external-consumers.sh

  path-with-spaces:
    name: Path-with-spaces smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev
      - name: Verify paths with spaces
        env:
          CC: gcc-14
          CXX: g++-14
        run: scripts/verify-path-with-spaces.sh

  pkg-config:
    name: pkg-config consumer smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev pkg-config
      - name: Verify pkg-config consumer
        env:
          CC: gcc-14
          CXX: g++-14
        run: scripts/verify-pkg-config.sh

  shared-library:
    name: Shared library install smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev
      - name: Verify shared library consumer
        env:
          CC: gcc-14
          CXX: g++-14
        run: scripts/verify-shared-library.sh

  backend-packages:
    name: Installed backend package smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 git ninja-build libfreetype-dev libtinyxml2-dev libsdl2-dev xorg-dev libgl1-mesa-dev
      - name: Provision raylib CMake package
        env:
          CC: gcc-14
          CXX: g++-14
          RAYLIB_INSTALL_PREFIX: ${{ runner.temp }}/raylib-prefix
        run: scripts/provision-raylib-package.sh
      - name: Verify installed backend packages
        env:
          CC: gcc-14
          CXX: g++-14
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/raylib-prefix
          TEXRENDER_BACKEND_PACKAGE_REQUIRE: "1"
        run: scripts/verify-backend-packages.sh
