name: Nightly fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Maximum libFuzzer runtime in seconds"
        required: true
        default: "300"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  try-render:
    name: try_render corpus fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 22 and dependencies
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt-llvm.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22 libclang-rt-22-dev g++-14 ninja-build libfreetype-dev libtinyxml2-dev
      - name: Configure fuzz target
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-22
          -DTEXGUI_BACKEND=headless
          -DTEXGUI_BUILD_EXAMPLES=OFF
          -DTEXGUI_BUILD_TESTS=OFF
          -DTEXGUI_BUILD_BENCHMARKS=OFF
          -DTEXGUI_BUILD_FUZZERS=ON
      - name: Build fuzz target
        run: cmake --build build --target texgui_try_render_fuzzer -j
      - name: Seed corpus
        run: |
          mkdir -p fuzz-artifacts/corpus fuzz-artifacts/crashes
          cp tests/fuzz/corpus/* fuzz-artifacts/corpus/
      - name: Run corpus fuzzing
        env:
          ASAN_OPTIONS: detect_leaks=0
          DISPATCH_MAX_TOTAL_TIME: ${{ inputs.max_total_time }}
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          max_total_time="${DISPATCH_MAX_TOTAL_TIME:-300}"
          ./build/texgui_try_render_fuzzer fuzz-artifacts/corpus \
            -max_len=4096 \
            -max_total_time="${max_total_time}" \
            -artifact_prefix=fuzz-artifacts/crashes/ \
            -print_final_stats=1
      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fuzz-${{ github.run_id }}
          path: fuzz-artifacts
