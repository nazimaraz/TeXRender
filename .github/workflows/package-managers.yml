name: Package managers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vcpkg:
    name: vcpkg manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 git ninja-build curl zip unzip tar pkg-config
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure default headless through vcpkg
        run: >
          cmake -S . -B build-vcpkg -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DTEXRENDER_BUILD_EXAMPLES=OFF
          -DTEXRENDER_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build-vcpkg -j
      - name: Test
        run: ctest --test-dir build-vcpkg --output-on-failure
      - name: Verify overlay port
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-linux
        run: scripts/verify-vcpkg-overlay.sh
      - name: Verify overlay port with SDL2 feature
        env:
          TEXRENDER_VCPKG_PACKAGE_SPEC: texrender[sdl2]
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-linux
        run: scripts/verify-vcpkg-overlay.sh

  conan:
    name: Conan package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Conan and compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3-pip
          python3 -m pip install --upgrade pip conan
      - name: Detect profile
        run: CC=gcc-14 CXX=g++-14 conan profile detect --force
      - name: Create headless package
        run: >
          CC=gcc-14 CXX=g++-14 conan create .
          --build=missing
          -o "&:backend=headless"
          -o "&:with_examples=False"
          -o "&:with_tests=False"
          -o "&:with_benchmarks=False"
      - name: Create shared headless package
        run: >
          CC=gcc-14 CXX=g++-14 conan create .
          --build=missing
          -o "&:backend=headless"
          -o "&:shared=True"
          -o "&:with_examples=False"
          -o "&:with_tests=False"
          -o "&:with_benchmarks=False"
      - name: Create SVG package
        run: >
          CC=gcc-14 CXX=g++-14 conan create .
          --build=missing
          -o "&:backend=svg"
          -o "&:with_examples=False"
          -o "&:with_tests=False"
          -o "&:with_benchmarks=False"
      - name: Create SDL2 package
        run: >
          CC=gcc-14 CXX=g++-14 conan create .
          --build=missing
          -o "&:backend=sdl2"
          -o "&:with_examples=False"
          -o "&:with_tests=False"
          -o "&:with_benchmarks=False"
