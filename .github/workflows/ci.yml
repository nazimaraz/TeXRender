name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting gate. Pinned to the clang-format major the codebase is formatted
  # with (the .clang-format file uses options newer than Ubuntu's default 18),
  # and to ubuntu-24.04 so the apt.llvm.org suite name stays correct.
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt-llvm.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-22
      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format-22 --dry-run -Werror

  docs:
    name: Docs, notices, and public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
      - name: Check local Markdown links
        run: python3 scripts/check-doc-links.py
      - name: Check third-party notices
        run: python3 scripts/check-third-party-notices.py
      - name: Check public API snapshot
        run: python3 scripts/check-public-api.py
      - name: Generate API reference
        run: doxygen Doxyfile

  # Linux / GCC 14: build the default dependency-free headless backend and run
  # every test. No GPU, X11 or display required.
  linux:
    name: Linux · GCC 14 · default headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev pkg-config
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-linux-headless
          path: build/visual-regression
          if-no-files-found: ignore
      - name: Smoke-run the offscreen example
        run: ./build/texrender_offscreen 'e^{i\pi} + 1 = 0' /tmp/formula.png
      - name: Smoke-run the custom surface example
        run: ./build/texrender_custom_surface
      - name: Generate gallery artifacts
        env:
          TEXRENDER_BUILD_DIR: build
        run: scripts/generate-gallery.sh docs/gallery-formulas.txt build/gallery
      - name: Upload gallery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-gallery-linux-headless
          path: build/gallery
      - name: Install package
        run: cmake --install build --prefix /tmp/texrender-prefix
      - name: Configure installed package consumer
        run: >
          cmake -S tests/package_consumer -B package-consumer -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=/tmp/texrender-prefix
      - name: Build installed package consumer
        run: cmake --build package-consumer -j
      - name: Test installed package consumer
        run: ctest --test-dir package-consumer --output-on-failure
      - name: Verify pkg-config consumer
        env:
          CXX: g++-14
        run: scripts/verify-pkg-config.sh

  # Compile texrender itself, examples, tests and benchmarks with a strict warning
  # profile. MicroTeX headers are included as SYSTEM headers so third-party
  # warnings do not become consumer build failures.
  strict-warnings:
    name: Linux · GCC 14 · warnings-as-errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-14
          -DTEXRENDER_BACKEND=headless
          -DTEXRENDER_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j

  svg:
    name: Linux · GCC 14 · SVG backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DTEXRENDER_BACKEND=svg
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke-run SVG export
        run: ./build/texrender_svg_export 'e^{i\pi} + 1 = 0' /tmp/formula.svg

  sdl2:
    name: Linux · GCC 14 · SDL2 backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev libsdl2-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DTEXRENDER_BACKEND=sdl2
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Short PR fuzz smoke. This does not replace longer local/nightly campaigns;
  # it simply proves the harness builds and exercises parser error paths under
  # sanitizers.
  fuzz:
    name: Linux · Clang 22 · fuzz smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 22 and dependencies
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt-llvm.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22 libclang-rt-22-dev g++-14 ninja-build libfreetype-dev libtinyxml2-dev
      - name: Configure fuzz target
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-22
          -DTEXRENDER_BACKEND=headless
          -DTEXRENDER_BUILD_EXAMPLES=OFF
          -DTEXRENDER_BUILD_TESTS=OFF
          -DTEXRENDER_BUILD_BENCHMARKS=OFF
          -DTEXRENDER_BUILD_FUZZERS=ON
      - name: Build fuzz target
        run: cmake --build build --target texrender_try_render_fuzzer -j
      - name: Run fuzz smoke
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./build/texrender_try_render_fuzzer -runs=500 -max_len=256

  # Address + UndefinedBehavior sanitizers over the full headless suite, with
  # findings fatal (-fno-sanitize-recover). Leak detection stays off: the
  # library deliberately keeps process-lifetime singletons (MicroTeX's global
  # init, the shared glyph cache) — see the README's threading section.
  sanitizers:
    name: Linux · GCC 14 · ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=g++-14
          -DTEXRENDER_BACKEND=headless
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  # Linux / GCC 14: build the raylib backend + examples — the most common
  # consumer configuration. raylib comes from FetchContent (exercising that
  # fallback on Linux), which needs the X11/GL dev headers to compile. The test
  # suite still runs: no test opens a window (the e2e test injects a headless
  # canvas).
  linux-raylib:
    name: Linux · GCC 14 · raylib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev xorg-dev libgl1-mesa-dev
      - name: Configure (raylib backend + examples + tests)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DTEXRENDER_BACKEND=raylib
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-linux-raylib
          path: build/visual-regression
          if-no-files-found: ignore

  # macOS / Apple Clang: build the real raylib backend (with examples) AND the
  # headless backend, running the tests for each. This is the reference platform.
  macos:
    name: macOS · Apple Clang · raylib + headless
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install dependencies
        run: brew install ninja freetype raylib tinyxml2
      - name: Configure (raylib backend + examples + tests)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTEXRENDER_BACKEND=raylib
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Configure (headless backend)
        run: cmake -S . -B build-headless -G Ninja -DCMAKE_BUILD_TYPE=Release -DTEXRENDER_BACKEND=headless
      - name: Build (headless)
        run: cmake --build build-headless -j
      - name: Test (headless)
        run: ctest --test-dir build-headless --output-on-failure
      - name: Smoke-run offscreen example (headless)
        run: ./build-headless/texrender_offscreen 'e^{i\pi} + 1 = 0' "$RUNNER_TEMP/formula.png"
      - name: Smoke-run custom surface example (headless)
        run: ./build-headless/texrender_custom_surface
      - name: Install headless package
        run: cmake --install build-headless --prefix "$RUNNER_TEMP/texrender-prefix"
      - name: Configure installed package consumer (headless)
        run: >
          cmake -S tests/package_consumer -B package-consumer -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/texrender-prefix"
      - name: Build installed package consumer (headless)
        run: cmake --build package-consumer -j
      - name: Test installed package consumer (headless)
        run: ctest --test-dir package-consumer --output-on-failure
      - name: Verify installed raylib package
        env:
          TEXRENDER_BACKEND_PACKAGE_BACKENDS: raylib
          TEXRENDER_BACKEND_PACKAGE_REQUIRE: "1"
        run: scripts/verify-backend-packages.sh

  # Windows / MSVC: build the headless backend (FreeType + tinyxml2 come from
  # FetchContent) and run every test, validating the MSVC support claim.
  windows:
    name: Windows · MSVC · headless + shared install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTEXRENDER_BACKEND=headless
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke-run offscreen example
        run: .\build\Release\texrender_offscreen.exe 'e^{i\pi} + 1 = 0' "$env:RUNNER_TEMP\formula.png"
      - name: Smoke-run custom surface example
        run: .\build\Release\texrender_custom_surface.exe
      - name: Configure shared library
        run: >
          cmake -S . -B build-shared
          -DBUILD_SHARED_LIBS=ON
          -DTEXRENDER_BACKEND=headless
          -DTEXRENDER_BUILD_EXAMPLES=OFF
          -DTEXRENDER_BUILD_BENCHMARKS=OFF
      - name: Build shared library
        run: cmake --build build-shared --config Release -j
      - name: Test shared library
        run: ctest --test-dir build-shared -C Release --output-on-failure
      - name: Install shared package
        run: cmake --install build-shared --config Release --prefix "$env:RUNNER_TEMP/texrender-prefix"
      - name: Configure shared package consumer
        run: >
          cmake -S tests/package_consumer -B package-consumer-shared
          -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP/texrender-prefix"
      - name: Build shared package consumer
        run: cmake --build package-consumer-shared --config Release -j
      - name: Test shared package consumer
        run: ctest --test-dir package-consumer-shared -C Release --output-on-failure
