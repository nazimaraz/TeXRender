name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-coverage:
    name: Headless coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev python3-pip
          python3 -m pip install --upgrade pip gcovr
      - name: Configure
        run: >
          cmake -S . -B build-coverage -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-14
          -DTEXRENDER_BACKEND=headless
          -DTEXRENDER_BUILD_EXAMPLES=OFF
          -DTEXRENDER_BUILD_TESTS=ON
          -DTEXRENDER_BUILD_BENCHMARKS=OFF
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build
        run: cmake --build build-coverage -j
      - name: Test
        run: ctest --test-dir build-coverage --output-on-failure
      - name: Generate coverage reports
        run: |
          gcovr \
            --root . \
            --filter 'source/' \
            --filter 'include/' \
            --exclude '.*/_deps/.*' \
            --exclude 'tests/.*' \
            --xml-pretty --xml coverage.xml \
            --html-details coverage.html \
            --print-summary
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.xml
            coverage.html
            coverage.*.html
