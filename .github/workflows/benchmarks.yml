name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-benchmark:
    name: Render benchmark
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DTEXRENDER_BACKEND=headless
          -DTEXRENDER_BUILD_EXAMPLES=OFF
          -DTEXRENDER_BUILD_TESTS=OFF
          -DTEXRENDER_BUILD_BENCHMARKS=ON
      - name: Build benchmark
        run: cmake --build build --target texrender_render_benchmark -j
      - name: Run benchmark
        run: |
          set -o pipefail
          ./build/texrender_render_benchmark --json benchmark-results.json | tee benchmark-results.txt
      - name: Compare with local baseline
        run: python3 scripts/check-benchmark-baseline.py --input benchmark-results.json --warn-only
      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: render-benchmark-${{ github.run_id }}
          path: |
            benchmark-results.txt
            benchmark-results.json
            docs/performance-baseline.json
