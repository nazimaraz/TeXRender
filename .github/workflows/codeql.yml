name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "22 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: C++ analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Configure
        run: >
          cmake -S . -B build-codeql -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=g++-14
          -DTEXRENDER_BACKEND=headless
          -DTEXRENDER_BUILD_EXAMPLES=ON
          -DTEXRENDER_BUILD_TESTS=ON
          -DTEXRENDER_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build-codeql -j
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
