name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: texgui-headless-linux-x64
            archive: tar.gz
            cpack_generator: TGZ
            configure: >-
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_CXX_COMPILER=g++-14
              -DTEXGUI_BACKEND=headless
            deps: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build libfreetype-dev libtinyxml2-dev
          - os: macos-15
            asset: texgui-headless-macos-arm64
            archive: tar.gz
            cpack_generator: TGZ
            configure: >-
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DTEXGUI_BACKEND=headless
            deps: brew install ninja freetype tinyxml2
          - os: windows-latest
            asset: texgui-headless-windows-x64
            archive: zip
            cpack_generator: ZIP
            configure: >-
              -DCMAKE_BUILD_TYPE=Release
              -DTEXGUI_BACKEND=headless
            deps: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        if: matrix.deps != ''
        shell: bash
        run: ${{ matrix.deps }}
      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install package
        run: cmake --install build --config Release --prefix dist/${{ matrix.asset }}
      - name: Archive package
        shell: bash
        run: |
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            cmake -E chdir dist cmake -E tar cf "${{ matrix.asset }}.zip" --format=zip "${{ matrix.asset }}"
            asset_path="dist/${{ matrix.asset }}.zip"
          else
            cmake -E chdir dist cmake -E tar czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
            asset_path="dist/${{ matrix.asset }}.tar.gz"
          fi
          cmake -DINPUT_FILE="${asset_path}" -DOUTPUT_FILE="${asset_path}.sha256" -P cmake/WriteSha256.cmake
      - name: Build CPack package
        shell: bash
        run: |
          mkdir -p dist/cpack
          cpack --config build/CPackConfig.cmake -G "${{ matrix.cpack_generator }}" -C Release -B dist/cpack
          find dist/cpack -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | while IFS= read -r -d '' asset_path; do
            cmake -DINPUT_FILE="${asset_path}" -DOUTPUT_FILE="${asset_path}.sha256" -P cmake/WriteSha256.cmake
          done
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.*
            dist/cpack/*

  publish:
    name: Publish GitHub release
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Combine checksums
        run: |
          find release-assets -name '*.sha256' -print0 | sort -z | xargs -0 cat > release-assets/SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/*
