<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TeXRender raylib WebAssembly</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f7f4;
            color: #202124;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        main {
            display: grid;
            grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
            min-height: 100vh;
        }

        .panel {
            display: grid;
            align-content: start;
            gap: 18px;
            padding: 28px;
            border-right: 1px solid #deded8;
            background: #fff;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0;
        }

        label {
            display: grid;
            gap: 8px;
            font-size: 13px;
            font-weight: 650;
            color: #4a4d50;
        }

        textarea,
        input {
            width: 100%;
            border: 1px solid #cfcfca;
            border-radius: 6px;
            background: #fff;
            color: #202124;
            font: inherit;
        }

        textarea {
            min-height: 150px;
            padding: 12px;
            resize: vertical;
            font-family: "SFMono-Regular", Consolas, monospace;
            line-height: 1.5;
        }

        input {
            height: 38px;
            padding: 0 10px;
        }

        input[type="color"] {
            padding: 3px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            height: 42px;
            border: 0;
            border-radius: 6px;
            background: #2357c6;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            cursor: wait;
            background: #8b98b8;
        }

        .status {
            min-height: 20px;
            color: #606368;
            font-size: 13px;
        }

        .output {
            display: grid;
            place-items: center;
            min-width: 0;
            padding: 32px;
            overflow: auto;
        }

        .canvas-wrap {
            width: min(100%, 960px);
            border: 1px solid #deded8;
            border-radius: 8px;
            background: #fff;
            padding: 18px;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            outline: none;
        }

        @media (max-width: 760px) {
            main {
                grid-template-columns: 1fr;
            }

            .panel {
                border-right: 0;
                border-bottom: 1px solid #deded8;
                padding: 20px;
            }

            .output {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<main>
    <section class="panel">
        <h1>TeXRender raylib WebAssembly</h1>
        <label>
            LaTeX
            <textarea id="latex">\int_0^1 x^2\,dx = \frac{1}{3}</textarea>
        </label>
        <div class="row">
            <label>
                Size
                <input id="size" type="number" min="8" max="256" value="72">
            </label>
            <label>
                Color
                <input id="color" type="color" value="#1a1a2e">
            </label>
        </div>
        <label>
            Wrap width
            <input id="wrap" type="number" min="0" max="4096" value="360">
        </label>
        <button id="render" type="button" disabled>Render</button>
        <div id="status" class="status">Loading WebAssembly...</div>
    </section>
    <section class="output">
        <div class="canvas-wrap">
            <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        </div>
    </section>
</main>
<script src="texrender_wasm_raylib.js"></script>
<script>
    const els = {
        latex: document.querySelector("#latex"),
        size: document.querySelector("#size"),
        color: document.querySelector("#color"),
        wrap: document.querySelector("#wrap"),
        render: document.querySelector("#render"),
        status: document.querySelector("#status"),
        canvas: document.querySelector("#canvas"),
    };

    const argbFromHex = (hex) => Number.parseInt(`ff${hex.slice(1)}`, 16) >>> 0;

    const showStatus = (text, isError = false) => {
        els.status.textContent = text;
        els.status.style.color = isError ? "#b3261e" : "#606368";
    };

    createTeXRenderRaylibModule({ canvas: els.canvas }).then((module) => {
        const renderFormula = module.cwrap("texrender_raylib_render", "number", ["string", "number", "number", "number"]);
        const lastError = module.cwrap("texrender_raylib_last_error", "string", []);
        const width = module.cwrap("texrender_raylib_width", "number", []);
        const height = module.cwrap("texrender_raylib_height", "number", []);

        const render = () => {
            const ok = renderFormula(
                els.latex.value,
                Number.parseFloat(els.size.value),
                argbFromHex(els.color.value),
                Number.parseInt(els.wrap.value, 10) || 0
            );
            if (!ok) {
                showStatus(lastError() || "Render failed", true);
                return;
            }

            showStatus(`Ready: ${width()} x ${height()}`);
        };

        els.render.disabled = false;
        els.render.addEventListener("click", render);
        els.latex.addEventListener("input", render);
        els.size.addEventListener("input", render);
        els.color.addEventListener("input", render);
        els.wrap.addEventListener("input", render);
        render();
    }).catch((error) => {
        showStatus(error instanceof Error ? error.message : String(error), true);
    });
</script>
</body>
</html>
