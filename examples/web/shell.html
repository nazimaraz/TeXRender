<!doctype html>
<!-- Emscripten shell for the texrender live editor ({{{ SCRIPT }}} is replaced
     by the generated loader at link time). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>texrender — live LaTeX rendering in the browser</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171726;
      --muted: #686978;
      --panel: #ffffff;
      --line: #d9dbe7;
      --accent: #2860c8;
      --backdrop: #f6f7fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--backdrop);
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    main {
      width: min(1080px, 100%);
      margin: 0 auto;
      padding: 22px 16px 18px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.15;
      letter-spacing: 0;
    }

    header p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .stage {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 8px 28px rgba(28, 32, 50, 0.08);
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fafafa;
    }
    canvas:focus { outline: none; }

    .below {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.35;
    }

    #status {
      min-height: 1.2em;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      main { padding: 16px 10px; }
      header {
        align-items: flex-start;
        flex-direction: column;
      }
      .links { justify-content: flex-start; }
      .stage { padding: 8px; }
      .below { flex-direction: column; gap: 6px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>texrender live LaTeX renderer</h1>
        <p>C++ engine compiled to WebAssembly: MicroTeX layout, FreeType glyphs, raylib on WebGL.</p>
      </div>
      <nav class="links" aria-label="Project links">
        <a href="https://github.com/nazimaraz/TeXRender">GitHub</a>
        <a href="https://github.com/NanoMichael/MicroTeX">MicroTeX</a>
        <a href="https://www.raylib.com/">raylib</a>
      </nav>
    </header>
    <section class="stage" aria-label="Live renderer">
      <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      <div class="below">
        <span id="status">Loading…</span>
        <span>Click the canvas, type LaTeX, use Tab for presets.</span>
      </div>
    </section>
  </main>
  <script>
    var statusElement = document.getElementById('status');
    var Module = {
      canvas: (function () {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener('webglcontextlost', function (e) {
          statusElement.textContent = 'WebGL context lost — please reload the page.';
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      setStatus: function (text) {
        statusElement.textContent = text;
      },
      onRuntimeInitialized: function () {
        statusElement.textContent = '';
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
